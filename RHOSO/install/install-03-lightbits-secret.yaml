# install-03-lightbits-secret.yaml
#
# Kubernetes Secret storing the Lightbits JWT token for the Cinder volume driver.
#
# The JWT token is sensitive and must NOT be placed in the OpenStackControlPlane
# CR's customServiceConfig where it would be visible in plaintext via:
#   oc get openstackcontrolplane -o yaml
#
# This Secret is referenced from the OpenStackControlPlane CR via:
#   cinderVolumes.lightbits.customServiceConfigSecrets:
#     - cinder-volume-lightbits-secret
#
# The RHOSO operator mounts this Secret as a config file fragment that is
# merged with customServiceConfig, making the JWT available to the Cinder
# volume driver without exposing it in the CR.
#
# Replace <LIGHTOS_JWT_TOKEN> with your actual JWT token.
#
apiVersion: v1
kind: Secret
metadata:
  name: cinder-volume-lightbits-secret
  namespace: openstack
  labels:
    service: cinder
    component: cinder-volume
type: Opaque
stringData:
  lightbits-secret.conf: |
    [lightbits]
    lightos_jwt = <LIGHTOS_JWT_TOKEN>
