# install-03-lightbits-secret.yaml
#
# Kubernetes Secret storing the Lightbits connection credentials for
# the Cinder volume driver.
#
# Sensitive values must NOT be placed in the OpenStackControlPlane
# CR's customServiceConfig where they would be visible in plaintext via:
#   oc get openstackcontrolplane -o yaml
#
# This Secret is referenced from the OpenStackControlPlane CR via:
#   cinderVolumes.lightbits.customServiceConfigSecrets:
#     - cinder-volume-lightbits-secret
#
# Replace the following placeholders:
#   <LIGHTOS_API_IP>    - Lightbits API server IP address
#   <LIGHTOS_JWT_TOKEN> - JWT token for Lightbits API authentication
#
apiVersion: v1
kind: Secret
metadata:
  name: cinder-volume-lightbits-secret
  namespace: openstack
  labels:
    service: cinder
    component: cinder-volume
type: Opaque
stringData:
  lightbits-secret.conf: |
    [lightbits]
    lightos_api_address = <LIGHTOS_API_IP>
    lightos_api_port = 443
    lightos_jwt = <LIGHTOS_JWT_TOKEN>
