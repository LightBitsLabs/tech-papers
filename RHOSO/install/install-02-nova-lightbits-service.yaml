# OpenStackDataPlaneService for LightBits integration on EDPM compute nodes.
#
# This service:
# 1. Creates the sudoers file for nova privsep-helper with SETENV privileges
# 2. Ensures /etc/discovery-client/discovery.d/ exists on the host
#
# The actual bind mounts into nova_compute are handled via
# edpm_nova_extra_bind_mounts in the OpenStackDataPlaneNodeSet ansibleVars:
#
#   nodeTemplate:
#     ansible:
#       ansibleVars:
#         edpm_nova_extra_bind_mounts:
#           - src: /etc/discovery-client
#             dest: /etc/discovery-client
#             options: rw,z
#           - src: /etc/sudoers.d/nova-lightbits
#             dest: /etc/sudoers.d/nova
#             options: ro
#
# Add "nova-lightbits-discovery-client" to your OpenStackDataPlaneNodeSet
# services list BEFORE "nova" so the sudoers file and directory exist
# when nova_compute is first created.
#
apiVersion: dataplane.openstack.org/v1beta1
kind: OpenStackDataPlaneService
metadata:
  name: nova-lightbits-discovery-client
  namespace: openstack
spec:
  label: nova-lightbits-discovery-client
  playbookContents: |
    - hosts: all
      become: true
      tasks:
        - name: Create nova sudoers file with SETENV for privsep-helper
          ansible.builtin.copy:
            dest: /etc/sudoers.d/nova-lightbits
            mode: '0440'
            content: |
              Defaults:nova !requiretty
              nova ALL = (root) NOPASSWD: /usr/bin/nova-rootwrap /etc/nova/rootwrap.conf *
              nova ALL = (root) SETENV: NOPASSWD: /usr/bin/privsep-helper *

        - name: Ensure /etc/discovery-client/discovery.d directory exists
          ansible.builtin.file:
            path: /etc/discovery-client/discovery.d
            state: directory
            mode: '0755'
            owner: root
            group: root
