# install-03-lightbits-glance-secret.yaml
#
# Kubernetes Secret storing the Glance credentials for the Lightbits
# Cinder backend used by Glance.
#
# The Glance password is sensitive and must NOT be placed in the
# OpenStackControlPlane CR's customServiceConfig where it would be
# visible in plaintext via: oc get openstackcontrolplane -o yaml
#
# This Secret is referenced from the OpenStackControlPlane CR via:
#   glanceAPIs.cinder.customServiceConfigSecrets:
#     - glance-lightbits-secret
#
# Replace <GLANCE_PASSWORD> with the Glance service user password
# (found in osp-secret under the 'GlancePassword' key).
#
apiVersion: v1
kind: Secret
metadata:
  name: glance-lightbits-secret
  namespace: openstack
  labels:
    service: glance
    component: glance-api
type: Opaque
stringData:
  glance-lightbits-secret.conf: |
    [cinder]
    cinder_store_password = <GLANCE_PASSWORD>
