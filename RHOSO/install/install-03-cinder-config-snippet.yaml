# 03-cinder-config-snippet.yaml
#
# This file contains ONLY the Cinder section of the OpenStackControlPlane CR
# needed to enable the Lightbits volume backend.
#
# It is NOT a standalone file — merge this section into your existing
# OpenStackControlPlane CR (alongside keystone, neutron, nova, galera,
# rabbitmq, ovn, etc.)
#
# This is the minimal, unmodified-driver configuration: no os-brick or
# Cinder driver patches, no Cinder backup, no Glance integration. It covers
# volume create/delete/extend/snapshot/retype and attach to a running VM.
#
# Replace the following placeholders:
#   <LIGHTOS_API_IP>    - Lightbits API server IP address
#   <LIGHTOS_JWT_TOKEN> - JWT token for Lightbits API authentication
#
# -----------------------------------------------------------------------

  cinder:
    template:
      databaseInstance: openstack
      secret: osp-secret
      cinderAPI:
        replicas: 1
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: internalapi
                  metallb.universe.tf/allow-shared-ip: internalapi
              spec:
                type: LoadBalancer
      cinderScheduler:
        replicas: 1
      cinderVolumes:
        lightbits:
          customServiceConfig: |
            [DEFAULT]
            enabled_backends = lightbits
            default_volume_type = lightbits
            [lightbits]
            volume_driver = cinder.volume.drivers.lightos.LightOSVolumeDriver
            volume_backend_name = lightos
            lightos_api_address = <LIGHTOS_API_IP>
            lightos_api_port = 443
            lightos_jwt = <LIGHTOS_JWT_TOKEN>
            lightos_default_num_replicas = 1
            lightos_default_compression_enabled = False
            lightos_api_service_timeout = 30
          replicas: 1
