# 05-cinder-glance-config-snippet.yaml
#
# This file contains ONLY the Cinder and Glance sections of the
# OpenStackControlPlane CR that are specific to LightBits integration.
#
# It is NOT a standalone file — merge these sections into your existing
# OpenStackControlPlane CR (typically alongside keystone, neutron, nova,
# galera, rabbitmq, ovn, etc.)
#
# Prerequisites before applying the full CR:
#   oc apply -f 03-lightos-osbrick-patch-configmap.yaml
#   oc apply -f 04-lightos-cinder-discovery-pvc.yaml
#   oc create configmap cinder-nfs-shares -n openstack \
#     --from-literal=nfs_shares="<NFS_SERVER_IP>:/path/to/export"
#
# Replace the following placeholders:
#   <LIGHTOS_API_IP>    - LightBits API server IP address
#   <LIGHTOS_JWT_TOKEN> - JWT token for LightBits API authentication
#   <NFS_SERVER_IP>     - NFS server IP for Cinder backup
#   <GLANCE_PASSWORD>   - Glance service user password (from osp-secret)
#
# -----------------------------------------------------------------------

  cinder:
    template:
      databaseInstance: openstack
      secret: osp-secret
      extraMounts:
        # v1: NFS mount point for cinder-backup pod
        - name: v1
          region: r1
          extraVol:
            - propagation:
                - CinderBackup
              extraVolType: Internal
              mounts:
                - name: backup-store
                  mountPath: /var/lib/cinder/backup
              volumes:
                - name: backup-store
                  persistentVolumeClaim:
                    claimName: cinder-backup-pvc

        # v2: Patched os-brick connector, privsep module, and Cinder driver.
        # Fixes local NVMe/TCP attach from within OCP pods.
        # See 03-lightos-osbrick-patch-configmap.yaml for details.
        - name: v2
          region: r1
          extraVol:
            - propagation:
                - CinderBackup
                - CinderVolume
              extraVolType: Internal
              mounts:
                - name: lightos-connector-patch
                  mountPath: /usr/lib/python3.9/site-packages/os_brick/initiator/connectors/lightos.py
                  subPath: lightos.py
                - name: lightos-connector-patch
                  mountPath: /usr/lib/python3.9/site-packages/os_brick/privileged/lightos.py
                  subPath: lightos_priv.py
              volumes:
                - name: lightos-connector-patch
                  configMap:
                    name: lightos-connector-patch
            - propagation:
                - CinderVolume
              extraVolType: Internal
              mounts:
                - name: lightos-driver-patch
                  mountPath: /usr/lib/python3.9/site-packages/cinder/volume/drivers/lightos.py
                  subPath: lightos_driver.py
              volumes:
                - name: lightos-driver-patch
                  configMap:
                    name: lightos-connector-patch

        # v3: Writable directory for NVMe/TCP discovery-client .conf files.
        # Uses a PVC to get the correct SELinux context for file writes.
        # See 04-lightos-cinder-discovery-pvc.yaml
        - name: v3
          region: r1
          extraVol:
            - propagation:
                - CinderBackup
                - CinderVolume
              extraVolType: Internal
              mounts:
                - name: discovery-client-dir
                  mountPath: /etc/discovery-client/discovery.d
              volumes:
                - name: discovery-client-dir
                  persistentVolumeClaim:
                    claimName: cinder-discovery-client-pvc

        # v4: Host node name injected for NVMe/TCP NQN construction.
        # The patched connector reads /etc/node-hostname to build:
        # nqn.2019-09.com.lightbitslabs:host:<node-name>.node
        # This matches the NQN the CSI driver uses for volume ACLs.
        - name: v4
          region: r1
          extraVol:
            - propagation:
                - CinderBackup
                - CinderVolume
              extraVolType: Internal
              mounts:
                - name: node-hostname
                  mountPath: /etc/node-hostname
              volumes:
                - name: node-hostname
                  hostPath:
                    path: /etc/hostname
                    type: File

      cinderAPI:
        replicas: 1
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: internalapi
                  metallb.universe.tf/allow-shared-ip: internalapi
              spec:
                type: LoadBalancer
      cinderScheduler:
        replicas: 1
      cinderVolumes:
        lightbits:
          customServiceConfig: |
            [DEFAULT]
            enabled_backends = lightbits
            default_volume_type = lb-replica1-xfs
            [lightbits]
            volume_driver = cinder.volume.drivers.lightos.LightOSVolumeDriver
            volume_backend_name = lightos
            lightos_api_address = <LIGHTOS_API_IP>
            lightos_api_port = 443
            lightos_jwt = <LIGHTOS_JWT_TOKEN>
            lightos_default_num_replicas = 1
            lightos_default_compression_enabled = False
            lightos_api_service_timeout = 30
          replicas: 1
    cinderBackup:
      replicas: 1
      customServiceConfig: |
        [DEFAULT]
        backup_driver = cinder.backup.drivers.nfs.NFSBackupDriver
        backup_share = <NFS_SERVER_IP>:/path/to/export
        backup_mount_point_base = /var/lib/cinder/backup

  glance:
    enabled: true
    template:
      databaseInstance: openstack
      secret: osp-secret
      storage:
        storageClass: lb-replica1-xfs
        storageRequest: 10Gi
      # keystoneEndpoint must match the glanceAPIs key below
      keystoneEndpoint: cinder
      extraMounts:
        # os-brick patches for Glance Cinder backend local attach
        - name: v1
          region: r1
          extraVol:
            - propagation:
                - GlanceAPI
              extraVolType: Internal
              mounts:
                - name: lightos-connector-patch
                  mountPath: /usr/lib/python3.9/site-packages/os_brick/initiator/connectors/lightos.py
                  subPath: lightos.py
                - name: lightos-connector-patch
                  mountPath: /usr/lib/python3.9/site-packages/os_brick/privileged/lightos.py
                  subPath: lightos_priv.py
              volumes:
                - name: lightos-connector-patch
                  configMap:
                    name: lightos-connector-patch
        # Discovery-client directory for Glance local attach
        - name: v2
          region: r1
          extraVol:
            - propagation:
                - GlanceAPI
              extraVolType: Internal
              mounts:
                - name: discovery-client-dir
                  mountPath: /etc/discovery-client/discovery.d
              volumes:
                - name: discovery-client-dir
                  persistentVolumeClaim:
                    claimName: glance-discovery-client-pvc
        # Node hostname for NQN construction
        - name: v3
          region: r1
          extraVol:
            - propagation:
                - GlanceAPI
              extraVolType: Internal
              mounts:
                - name: node-hostname
                  mountPath: /etc/node-hostname
              volumes:
                - name: node-hostname
                  hostPath:
                    path: /etc/hostname
                    type: File
      glanceAPIs:
        # Glance with Cinder backend requires 'split' layout type.
        # This creates two API pods: internal (write) and external (read).
        # The key name here must match keystoneEndpoint above.
        cinder:
          replicas: 1
          type: split
          customServiceConfig: |
            [DEFAULT]
            enabled_backends = cinder:cinder
            [glance_store]
            default_backend = cinder
            [cinder]
            cinder_store_auth_address = https://keystone-internal.openstack.svc:5000
            cinder_store_user_name = glance
            cinder_store_password = <GLANCE_PASSWORD>
            cinder_store_project_name = service
            cinder_volume_type = lb-replica1-xfs
            cinder_store_replication_enabled = False
          override:
            service:
              internal:
                metadata:
                  annotations:
                    metallb.universe.tf/address-pool: internalapi
                    metallb.universe.tf/allow-shared-ip: internalapi
                spec:
                  type: LoadBalancer
          tls:
            api:
              internal: {}
              public: {}
      memcachedInstance: memcached
      imageCache:
        replicas: 1
        containerImage: registry.redhat.io/rhosp18/openstack-glance-api:18.0
