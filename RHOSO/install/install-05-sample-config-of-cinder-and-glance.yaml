# install-05-sample-config-of-cinder-and-glance.yaml
#
# Sample Cinder and Glance configuration for Lightbits integration.
#
# This file contains ONLY the Cinder and Glance sections of the
# OpenStackControlPlane CR. Merge these sections into your existing CR
# alongside keystone, neutron, nova, galera, rabbitmq, ovn, etc.
#
# Replace the following placeholders:
#   <LIGHTOS_API_IP>  - Lightbits API server IP address
#   <GLANCE_PASSWORD> - Glance service user password (from osp-secret)
#
# The Lightbits JWT token must be stored in a Secret — see
# install-03-lightbits-secret.yaml. Do NOT put it in customServiceConfig.
#
# IMPORTANT: The extraMounts section is REQUIRED for Lightbits local attach
# (backup, create-from-image, boot-from-volume, retype) to work.
# Do NOT remove or modify the extraMounts entries.
#
# -----------------------------------------------------------------------

  cinder:
    template:
      databaseInstance: openstack
      secret: osp-secret
      extraMounts:
        # REQUIRED: Host node name for NVMe/TCP connectivity.
        # The os-brick LightOS connector reads /etc/node-hostname to connect
        # to the discovery-client at node-IP:6060 (rather than localhost:6060
        # which is unreachable from inside an OCP pod's network namespace).
        - name: v1
          region: r1
          extraVol:
            - propagation:
                - CinderBackup
                - CinderVolume
              extraVolType: Internal
              mounts:
                - name: node-hostname
                  mountPath: /etc/node-hostname
              volumes:
                - name: node-hostname
                  hostPath:
                    path: /etc/hostname
                    type: File

        # REQUIRED: Discovery-client directory for NVMe/TCP local attach.
        # os-brick writes temporary .conf files here during volume attach
        # operations. The discovery-client reads these files to establish
        # NVMe/TCP connections. Files are deleted after disconnect.
        - name: v2
          region: r1
          extraVol:
            - propagation:
                - CinderBackup
                - CinderVolume
              extraVolType: Internal
              mounts:
                - name: discovery-client-dir
                  mountPath: /etc/discovery-client/discovery.d
              volumes:
                - name: discovery-client-dir
                  emptyDir: {}

      cinderAPI:
        replicas: 1
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: internalapi
                  metallb.universe.tf/allow-shared-ip: internalapi
              spec:
                type: LoadBalancer
      cinderScheduler:
        replicas: 1
      cinderVolumes:
        lightbits:
          customServiceConfig: |
            [DEFAULT]
            enabled_backends = lightbits
            default_volume_type = lightbits-volume-replica-2
            [lightbits]
            volume_driver = cinder.volume.drivers.lightos.LightOSVolumeDriver
            volume_backend_name = lightos
            lightos_api_address = <LIGHTOS_API_IP>
            lightos_api_port = 443
            lightos_default_num_replicas = 2
            lightos_default_compression_enabled = False
            lightos_api_service_timeout = 30
            [privsep_osbrick]
            helper_command = sudo -E /usr/bin/privsep-helper --config-file /etc/cinder/cinder.conf --config-dir /etc/cinder/cinder.conf.d
            capabilities = CAP_DAC_READ_SEARCH
            [os_brick]
            lightos_discovery_client_address = localhost
          customServiceConfigSecrets:
            - cinder-volume-lightbits-secret
          replicas: 1

  glance:
    enabled: true
    template:
      databaseInstance: openstack
      secret: osp-secret
      keystoneEndpoint: cinder
      glanceAPIs:
        cinder:
          replicas: 1
          type: split
          customServiceConfig: |
            [DEFAULT]
            enabled_backends = cinder:cinder
            [glance_store]
            default_backend = cinder
            [cinder]
            cinder_store_auth_address = https://keystone-internal.openstack.svc:5000
            cinder_store_user_name = glance
            cinder_store_password = <GLANCE_PASSWORD>
            cinder_store_project_name = service
            cinder_volume_type = lightbits-volume-replica-2
            cinder_store_replication_enabled = False
          override:
            service:
              internal:
                metadata:
                  annotations:
                    metallb.universe.tf/address-pool: internalapi
                    metallb.universe.tf/allow-shared-ip: internalapi
                spec:
                  type: LoadBalancer
          tls:
            api:
              internal: {}
              public: {}
      memcachedInstance: memcached
